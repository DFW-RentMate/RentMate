name: DFW-RentMate 1st Week CI Test

# 1. When should this workflow run?
on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # [JOB 1] Frontend (Next.js) Automated Tests
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run code linter
        run: |
          cd frontend
          npm run lint

      - name: Run Next.js production build test
        run: |
          cd frontend
          npm run build

  # [JOB 2] Backend (FastAPI) Automated Tests
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and setup virtual environment
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check FastAPI syntax (Compile test)
        run: |
          cd backend
          source venv/bin/activate
          python -m py_compile main.py