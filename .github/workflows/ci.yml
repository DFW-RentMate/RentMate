name: DFW-RentMate 1st Week CI Test

# 1. When should this workflow run?
on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # [JOB 1] Frontend (Next.js) Automated Tests
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run code linter
        run: |
          cd frontend
          npm run lint

      - name: Run Next.js production build test
        run: |
          cd frontend
          npm run build

  